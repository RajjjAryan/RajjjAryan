name: Refresh profile metrics

on:
  # A weekly static refresh keeps the profile current without noisy commits.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # v3.34 is a stable release tag; avoid tracking the moving latest tag.
      - uses: lowlighter/metrics@v3.34
        with:
          # Preserve the existing repository secret; it must have public-profile access.
          token: ${{ secrets.ACCESS_TOKEN }}
          user: RajjjAryan
          filename: github-metrics.svg
          template: classic
          # Keep the generated card focused on contribution and owned-repository context.
          base: header, repositories
          repositories: 20
          repositories_forks: no
          repositories_affiliations: owner
          config_timezone: Asia/Kolkata
