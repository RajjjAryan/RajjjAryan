name: Refresh profile metrics

on:
  # Contributions happen outside this repository, so refresh from GitHub daily.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # v3.34 is a stable release tag; avoid tracking the moving latest tag.
      - uses: lowlighter/metrics@v3.34
        with:
          # Preserve the existing repository secret; it must have public-profile access.
          token: ${{ secrets.ACCESS_TOKEN }}
          user: RajjjAryan
          filename: github-metrics.svg
          template: classic
          # Include a full-year contribution view and accurate aggregate counters.
          base: header, repositories
          base_indepth: yes
          repositories: 100
          repositories_forks: no
          repositories_affiliations: owner
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_order: base.header, isocalendar, base.repositories
          config_timezone: Asia/Kolkata
